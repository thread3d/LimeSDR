// ogn-rf configuration for a LimeSDR-USB (LMS7002M) on 868 MHz
//
// Difference from an RTL-SDR configuration: RF.DeviceType selects the backend, and the gain is
// given in dB as SoapySDR reports it (-12 .. 61 on this board) instead of in an RTL-SDR tuner's
// discrete gain steps.  RF.DeviceSerial picks the board by serial, which is stable, where the
// enumeration index is not.
//
// FreqRaster is 1 (i.e. no rounding): the LMS7002M synthesiser has ~1 Hz resolution, so there is
// no reason to snap to the 28.125 kHz raster that RTL-SDR dongles need.
//
// Note: libconfig has no "outer braces" form - the settings start at the top level.

RF = {
  DeviceType   = "limesdr";
  DeviceSerial = "00090726074D1731";
  FreqPlan     = 1;                             // Europe/Africa: 868.200 and 868.400 MHz
  FreqRaster   = 1;
  BiasTee      = 0;                             // no on-board bias tee on a LimeSDR-USB
  OfsTune      = 0;
  FreqCorr     = 0;                             // [ppm] applied in software
  SampleRate   = 2000000;
  // On-chip capture-and-decimate ratio: N makes the LMS7002M run its converter at N x the host
  // rate and decimate inside the chip, so ogn-rf still receives RF.SampleRate. The backend steps
  // the requested value down to the largest power of two the converter can run at, so 32 at
  // 1 MSps becomes 16 at the 2 MSps used below (32 x 2 MSps would be a 64 MSps converter, past
  // its 61.44 MSps ceiling). 0 hands the choice back to the driver. If a device cannot deliver
  // the rate with the ratio asked for, the open retries once with auto rather than failing.
  //
  // Note: on this board with LimeSuite 20.01 this setting measures as having no effect at all -
  // every ratio from 0 to 4096 gives the same noise floor, OGN channel levels and DC spur to
  // within 0.1 dB. See docs/hardware.md. It is left at the highest ratio because that is the
  // correct configuration where it does take effect, not because it helps here.
  Oversample   = 32;
  OGN = {
    Gain        = 61.0;                         // [dB] as SoapySDR reports it; 61 is the top of the
                                                // range and measured best - at 50 the receiver was
                                                // still sitting on its own converter floor
    GainMode    = 1;                            // manual
    SampleRate  = 2000000;
    SensTime    = 0.85;
    StartTime   = 0.375;
    SaveRawData = 0;
  };
};

Position = { Latitude = 51.5; Longitude = -0.1; };
APRS     = { Call = "TEST0"; };
HTTP     = { Port = 8095; };
